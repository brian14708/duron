name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
      - name: Run examples
        run: uv run python examples/hello_world.py "$RUNNER_TEMP/hello.db"
      - name: Run linter
        run: uv run ruff check
      - name: Run formatter
        run: uv run ruff format --check
      - name: Run mypy
        run: uv run mypy
      - name: Run pyright
        run: uv run pyright --warnings
      - name: Verify public types
        run: uv run pyright --verifytypes duron --ignoreexternal
      - name: Run pyrefly
        run: uv run pyrefly check
