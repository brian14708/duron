[project]
name = "duron"
version = "0.0.4"
description = "Durable async runtime for Python"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typing-extensions>=4.15.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://brian14708.github.io/duron/"
Source = "https://github.com/brian14708/duron"

[build-system]
requires = ["uv_build>=0.9.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "typing"},
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
]
typing = [
    "basedmypy",
    "basedpyright",
    "pyrefly",
    "pytest",
]
lint = [
    "ruff",
]
docs = [
    "mkdocstrings[python]",
    "zensical",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "missing-trailing-comma", "assert", "CPY",
    "D10", "incorrect-blank-line-before-class", "missing-blank-line-after-summary", "multi-line-summary-second-line",
    "FIX", "missing-todo-author", "missing-todo-link",
    "PLR09", "magic-value-comparison", "too-many-statements-in-try-clause", "complex-structure",
]
extend-safe-fixes = ["TC", "unused-import"]
preview = true
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["suspicious-non-cryptographic-random-usage", "import-private-name", "magic-value-comparison", "unused-async", "boolean-positional-value-in-call"]
"examples/**/*.py" = ["print", "suspicious-non-cryptographic-random-usage", "implicit-namespace-package"]

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions"]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["typing_extensions.TypedDict"]
runtime-evaluated-decorators = ["duron.workflow", "duron.effect"]
exempt-modules = ["typing", "typing_extensions"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict".msg = "Use typing_extensions.TypedDict instead."
"typing_extensions.AsyncContextManager".msg = "Use contextlib.AbstractAsyncContextManager instead."
"typing_extensions.AsyncGenerator".msg = "Use collections.abc.AsyncGenerator instead."

[tool.ruff.format]
preview = true
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff]
target-version = "py311"

[tool.mypy]
files = ["src", "tests"]
strict = true
python_version = "3.11"
disable_error_code = [
    "decorated-any",
    "explicit-any",
    "any",
]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
venv = "."
venvPath = ".venv"
typeCheckingMode = "strict"
enableExperimentalFeatures = true

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.11"
search-path = ["src"]
preset = "strict"
strict-callable-subtyping = true
strict-partial-subtyping = true
type-ignore-unknown-tag-behavior = "no-effect"

[tool.pyrefly.errors]
deprecated = "error"
non-convergent-recursion = "error"
unnecessary-type-conversion = "error"
untyped-import = "error"
unused-ignore = "error"
unused-type-ignore = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
